name: Phase 1A contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1a-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Verify Phase 1A contracts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/causalperf-pycache
        run: sh tools/test_all.sh
